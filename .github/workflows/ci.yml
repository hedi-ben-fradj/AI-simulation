name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aisim
          POSTGRES_PASSWORD: aisim
          POSTGRES_DB: aisim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aisim" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aisim:aisim@localhost:5432/aisim_test
        run: pytest -q tests/test_api_persistence.py tests/test_experiments.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
